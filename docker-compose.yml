services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-artex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 设置 POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-artex}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-artex} -d ${POSTGRES_DB:-artex}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  artex:
    # Built from THIS source with ./docker-build.sh (default artex-local). Do not
    # switch back to the upstream autumn27/artex image: it lacks the English UI,
    # the security fixes and the operator policy rules.
    image: ${ARTEX_IMAGE:-artex-local}:${ARTEX_TAG:-latest}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ARTEX_PG_DSN: postgres://${POSTGRES_USER:-artex}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-artex}?sslmode=disable
      ARTEX_UPDATE_GITHUB_TOKEN: ${ARTEX_UPDATE_GITHUB_TOKEN:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ARTEX_LLM_PROVIDER: ${ARTEX_LLM_PROVIDER:-}
      ARTEX_LLM_MODEL: ${ARTEX_LLM_MODEL:-}
      ARTEX_LLM_BASE_URL: ${ARTEX_LLM_BASE_URL:-}
      ARTEX_LLM_PROXY: ${ARTEX_LLM_PROXY:-}
      # Optional fixed one-time setup token for the first /setup (otherwise a random
      # one is printed in the logs and written to /app/keys/setup.token).
      ARTEX_SETUP_TOKEN: ${ARTEX_SETUP_TOKEN:-}
      # jwt.key + setup.token live here (mounted from ./keys below) so the JWT
      # signing key survives container re-creation: no forced re-login after an
      # update. Kept out of /app/data, which is browsable from the web file manager.
      ARTEX_KEY_DIR: /app/keys
      # Cross-origin browser access (only needed for `next dev`); empty = same-origin only.
      ARTEX_CORS_ORIGINS: ${ARTEX_CORS_ORIGINS:-}
    ports:
      # Host side configurable via .env: ARTEX_BIND (e.g. 127.0.0.1 to keep the UI
      # local behind a reverse proxy) and ARTEX_HTTP_PORT. Defaults keep upstream
      # behaviour (0.0.0.0:8787).
      - "${ARTEX_BIND:-0.0.0.0}:${ARTEX_HTTP_PORT:-8787}:8787"
      - "127.0.0.1:${ARTEX_PROXY_PORT:-8788}:8788"
    volumes:
      # Data directory (SQLite stores, evidence, traffic) bound to ./data on the host
      # so it can be inspected/backed up and survives container re-creation.
      - ./data:/app/data
      # JWT signing key + setup token (see ARTEX_KEY_DIR). Back it up with ./data;
      # deleting it just logs everyone out.
      - ./keys:/app/keys
      # 把项目根目录的 skills 挂进容器（覆盖镜像内置的 /app/skills）；
      # 改 skill 无需重建镜像，容器读的就是宿主机这份。
      - ./skills:/app/skills
    restart: unless-stopped

volumes:
  pgdata:
